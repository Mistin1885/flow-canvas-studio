<dialog id="arrange-dialog" aria-labelledby="arrange-title">
  <form id="arrange-form">
    <header class="editor-head"><h2 id="arrange-title">自動排版</h2></header>
    <div class="editor-scroll editor-block">
      <label>流程方向
        <select id="arrange-direction">
          <option value="auto">依群組設定，預設由左向右</option>
          <option value="LR">由左向右 →</option>
          <option value="RL">由右向左 ←</option>
          <option value="TD">由上向下 ↓</option>
          <option value="BT">由下向上 ↑</option>
        </select>
      </label>
      <p>整張畫布的節點與連線將重新排列，包含已收合的節點。可按一次復原回到原本的位置與折線。</p>
    </div>
    <footer class="editor-footer">
      <small id="arrange-error" role="alert"></small>
      <button type="button" id="arrange-cancel">取消</button>
      <button type="submit" class="editor-primary">套用排版</button>
    </footer>
  </form>
</dialog>
