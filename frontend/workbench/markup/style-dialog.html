<dialog id="style-dialog" aria-labelledby="style-title">
  <header class="editor-head">
    <div><h2 id="style-title">畫布樣式</h2></div>
    <button type="button" id="style-close" aria-label="關閉畫布樣式">✕</button>
  </header>
  <div class="style-scroll">
    <div class="scope-switch" role="group" aria-label="樣式套用範圍">
      <button data-level="diagram">全圖預設</button>
      <button data-level="group">排版群組</button>
      <button data-level="node">個別節點</button>
    </div>
    <select id="style-target" aria-label="樣式對象"></select>
    <p id="style-impact"></p>
    <div class="style-columns">
      <section>
        <h3>節點外觀</h3>
        <div id="style-fields"></div>
        <div id="frame-fields" hidden>
          <h3>群組範圍框</h3>
          <div id="frame-controls"></div>
        </div>
      </section>
      <aside class="style-preview">
        <div class="style-preview-head">
          <strong>即時預覽</strong>
          <select id="preview-mode" aria-label="預覽主題">
            <option value="light">淺色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <div id="style-sample"></div>
        <p id="style-origin"></p>
      </aside>
    </div>
  </div>
  <footer class="editor-footer">
    <button type="button" id="reset-style">重設此層</button>
    <button type="button" id="cancel-style">取消</button>
    <button type="button" id="apply-style" class="primary">套用樣式</button>
  </footer>
</dialog>
