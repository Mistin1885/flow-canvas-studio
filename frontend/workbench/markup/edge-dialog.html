<dialog id="line-dialog" aria-labelledby="edge-heading">
  <form id="line-form">
    <header class="editor-head">
      <h2 id="edge-heading">編輯連線</h2>
      <button id="line-close" type="button" aria-label="關閉連線編輯">✕</button>
    </header>
    <div class="line-fields">
      <p id="edge-endpoints"></p>
      <div id="edge-pickers">
        <label>
          連線起點
          <select id="edge-from-control"></select>
        </label>
        <label>
          連線終點
          <select id="edge-to-control"></select>
        </label>
      </div>
      <div class="layout-pair wire-sides">
        <label
          >起點接點<select id="line-start-side">
            <option value="">自動</option>
            <option value="top">上方</option>
            <option value="right">右側</option>
            <option value="bottom">下方</option>
            <option value="left">左側</option>
          </select></label
        >
        <label
          >終點接點<select id="line-end-side">
            <option value="">自動</option>
            <option value="top">上方</option>
            <option value="right">右側</option>
            <option value="bottom">下方</option>
            <option value="left">左側</option>
          </select></label
        >
      </div>
      <label id="line-reset-row" class="line-check">
        <input type="checkbox" id="line-reset-layout" />還原線段、接點與文字的自動排版
      </label>
      <div class="condition-fields">
        <div class="condition-heading">
          <label for="line-text">條件文字</label>
          <select id="line-preset" aria-label="套用既有條件文字與配色"></select>
        </div>
        <input id="line-text" maxlength="200" placeholder="例如：核可、退回" />
      </div>
      <label for="line-style">線段樣式
        <select id="line-style">
          <option value="solid">實線</option>
          <option value="dashed">虛線</option>
          <option value="dotted">點線</option>
        </select>
      </label>
      <div class="edge-color-field">
        <label for="line-color">線段顏色</label>
        <label class="line-check"><input id="line-auto" type="checkbox" aria-label="線段顏色自動配色" />自動</label>
        <input type="color" id="line-color" />
        <div id="line-color-palette" class="edge-swatches" role="group" aria-label="線段顏色已用色"></div>
      </div>
      <div class="edge-color-field">
        <label for="line-label-color">條件文字底色</label>
        <label class="line-check"><input id="line-label-auto" type="checkbox" aria-label="條件文字底色自動配色" />自動</label>
        <input type="color" id="line-label-color" />
        <div id="line-label-color-palette" class="edge-swatches" role="group" aria-label="條件文字底色已用色"></div>
      </div>
    </div>
    <div class="editor-footer line-actions">
      <small id="line-error" role="alert"></small>
      <button type="submit" class="editor-primary">套用連線</button>
    </div>
  </form>
</dialog>
