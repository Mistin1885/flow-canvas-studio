<dialog id="node-editor" aria-labelledby="editor-title">
  <form id="node-form">
    <header class="editor-head">
      <div>
        <div class="draft-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g id="draft-team-icon"><circle cx="9" cy="8" r="3"/><path d="M2 20v-2a7 7 0 0 1 14 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 4 5"/></g>
            <g id="draft-lock-icon"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></g>
            <g id="draft-error-icon"><path d="m12 3 10 17H2ZM12 9v5m0 2v1"/></g>
          </svg>
          <b id="draft-badge-label"></b>
        </div>
        <h2 id="editor-title">編輯節點</h2>
      </div>
      <button type="button" id="editor-close" aria-label="關閉節點編輯器">✕</button>
    </header>
    <div class="editor-scroll">
      <p role="status" id="node-presence" hidden></p>
      <p class="editor-tip" id="editor-context"></p>
      <div class="editor-grid">
        <div class="node-id-field">
          <label for="node-id">節點 ID</label>
          <input
            id="node-id"
            required
            pattern="[A-Za-z][A-Za-z0-9_\-]{0,63}"
            maxlength="64"
            aria-describedby="id-check"
          />
          <button type="button" id="suggest-id" hidden>使用建議 ID</button>
          <small id="id-check" role="status"></small>
        </div>
        <label>
          節點類型
          <select id="node-type" required></select>
        </label>
        <label id="return-target-field" hidden>返回目標
          <select id="node-return-target"></select>
        </label>
        <fieldset class="layout-fields wide">
          <legend>排版群組</legend>
          <p>每個節點屬於一個群組。方向套用到同群組在各畫布區域內的節點。</p>
          <div class="layout-pair">
            <label>
              所屬群組
              <select id="node-group" required></select>
            </label>
            <label>
              群組流程方向
              <select id="group-direction">
                <option value="auto">自動 · 沿用原圖</option>
                <option value="TD">TD ↓ 由上往下</option>
                <option value="LR">LR → 由左往右</option>
                <option value="BT">BT ↑ 由下往上</option>
                <option value="RL">RL ← 由右往左</option>
              </select>
            </label>
          </div>
          <div class="edit-row">
            <input id="group-name" aria-label="新群組名稱" placeholder="新群組名稱" maxlength="80" />
            <button type="button" id="add-group">建立群組</button>
            <button type="button" class="manage-options" data-manage-options="group" data-option-label="排版群組" aria-label="管理排版群組選項">管理選項</button>
          </div>
          <small id="group-message" role="status"></small>
        </fieldset>
        <fieldset class="legend-editor">
          <legend>圖例分類 · 顏色與高亮（可複選）</legend>
          <div id="legend-fields"></div>
          <div class="edit-row">
            <input
              id="category-name"
              aria-label="自訂分類名稱"
              placeholder="自訂分類名稱"
              maxlength="64"
            />
            <input id="category-color" aria-label="分類顏色" type="color" value="#387ab4" />
            <button id="add-category" type="button">新增分類</button>
            <button type="button" class="manage-options" data-manage-options="category" data-option-label="圖例分類" aria-label="管理圖例分類選項">管理選項</button>
          </div>
          <div id="category-color-palette"></div>
          <small id="category-error" role="status"></small>
        </fieldset>
        <fieldset class="layout-fields">
          <legend>醒目標籤</legend>
          <div class="edit-row">
            <select id="badge-picker" aria-label="選擇醒目標籤"></select>
            <button type="button" id="badge-new">＋ 新增標籤</button>
            <button type="button" class="manage-options" data-manage-options="badge" data-option-label="醒目標籤" aria-label="管理醒目標籤選項">管理選項</button>
          </div>
          <div id="badge-assignments"></div>
          <p>點選標籤可編輯共用樣式。在畫布編輯模式中可拖曳標籤到節點上方或下方。</p>
          <div id="badge-style-editor" hidden>
            <label>標籤文字<input id="badge-name" maxlength="32" placeholder="例如：影響整櫃" /></label>
            <div class="badge-style-fields">
              <label>顏色<input type="color" id="badge-color" /></label>
              <label>樣式<select id="badge-style"><option value="solid">實心</option><option value="outline">外框</option></select></label>
              <label>圖示<select id="badge-icon"><option value="none">無</option><option value="warning">⚠ 警示</option><option value="time">◷ 時間</option><option value="info">ⓘ 提示</option><option value="star">★ 重點</option></select></label>
            </div>
            <div id="badge-color-palette"></div>
            <div class="edit-row"><span id="badge-preview"></span>
              <button type="button" id="badge-style-apply">建立並加入</button>
              <button type="button" id="badge-style-cancel">取消</button>
            </div>
          </div>
          <small id="badge-message" role="status"></small>
        </fieldset>
        <fieldset class="layout-fields">
          <legend>負責角色/負責人</legend>
          <select id="node-role" aria-label="負責角色/負責人"></select>
          <div class="edit-row">
            <input id="role-name" maxlength="80" aria-label="新負責角色/負責人" placeholder="新負責角色/負責人" />
            <button id="add-role" type="button">新增</button>
            <button type="button" class="manage-options" data-manage-options="role" data-option-label="負責角色／負責人" aria-label="管理負責角色／負責人選項">管理選項</button>
          </div>
          <small id="role-message" role="status"></small>
        </fieldset>
        <label>分流與匯合<select id="node-gateway"><option value="">無</option></select></label>
        <div id="custom-values" class="editor-grid wide"></div>
        <label class="wide">
          名稱
          <input id="node-title" required maxlength="200" />
        </label>
        <label class="wide">
          說明
          <textarea id="node-description" rows="3"></textarea>
        </label>
        <div class="wide"><button type="button" id="insert-knowledge">引用知識條目</button> <small>可先在說明、注意事項或文字步驟中選取連結文字。</small></div>
        <fieldset class="layout-fields">
          <legend>操作位置</legend>
          <select id="node-where" aria-label="操作位置"></select>
          <div class="edit-row">
            <input id="where-name" maxlength="500" aria-label="新操作位置" placeholder="新操作位置" />
            <button id="add-where" type="button">新增</button>
            <button type="button" class="manage-options" data-manage-options="where" data-option-label="操作位置" aria-label="管理操作位置選項">管理選項</button>
          </div>
          <small id="where-message" role="status"></small>
        </fieldset>
        <label class="wide">
          預期結果
          <textarea id="node-expect" rows="2"></textarea>
        </label>
        <label class="wide">
          注意事項
          <textarea id="node-note" rows="2"></textarea>
        </label>
      </div>
      <div class="editor-section-head">
        <h3>步驟內容</h3>
        <div>
          <button type="button" id="add-text-block">＋ 說明</button>
          <button type="button" id="add-code-block">＋ 指令</button>
        </div>
      </div>
      <p class="editor-tip">可加入說明與指令。內容會原樣保存，不會自動替換參數。</p>
      <div id="content-editor"></div>
      <div class="editor-section-head">
        <h3>從哪裡連入？</h3>
        <button type="button" id="add-incoming">＋ 前序連線</button>
      </div>
      <div id="current-incoming" class="editor-tip"></div>
      <div id="added-incoming"></div>
      <div class="editor-section-head">
        <h3>連到哪裡？</h3>
        <button type="button" id="add-edge">＋ 連線</button>
      </div>
      <p class="editor-tip">
        「下一步」會定位到目標節點；「返回／重試」會跳到指定節點。請確認連線方向與條件。
      </p>
      <div id="edge-editor"></div>
      <p class="editor-tip" id="editor-main-note"></p>
      <p id="option-changes" role="status"></p>
      <p id="editor-error" class="editor-error" role="alert"></p>
    </div>
    <footer class="editor-footer">
      <button type="button" id="delete-node">刪除此節點</button>
      <button type="button" id="new-node">＋ 新增後續節點</button>
      <p id="form-draft-status" role="status"></p>
      <button type="button" id="draft-discard" hidden>捨棄草稿</button>
      <button type="submit" class="editor-primary">套用變更</button>
    </footer>
  </form>
</dialog>

<dialog id="discard-draft-dialog" aria-labelledby="discard-draft-title" aria-describedby="discard-draft-description">
  <h2 id="discard-draft-title">捨棄這個節點的草稿？</h2>
  <p id="discard-draft-description"></p>
  <footer>
    <button type="button" id="discard-draft-cancel" autofocus>取消</button>
    <button type="button" id="discard-draft-confirm" class="editor-primary">確認捨棄</button>
  </footer>
</dialog>

<dialog id="option-dialog" aria-labelledby="option-title">
  <form id="option-form">
    <header class="editor-head"><h2 id="option-title">管理選項</h2>
      <button type="button" id="option-close" aria-label="關閉選項管理">✕</button></header>
    <div class="editor-scroll">
      <label>目前畫布的選項<select id="managed-option"></select></label>
      <p id="option-impact" role="status"></p>
      <label>選項名稱<input id="option-name" required /></label>
      <p class="editor-tip">完成後，請在節點編輯器按「套用變更」發佈到此畫布。</p>
      <p id="option-error" class="editor-error" role="alert"></p>
    </div>
    <footer class="editor-footer"><button id="option-delete" type="button">刪除選項</button>
      <button id="option-add" type="button" hidden>新增為另一個選項</button>
      <button id="option-rename" type="submit" class="editor-primary">套用新名稱</button></footer>
  </form>
</dialog>
