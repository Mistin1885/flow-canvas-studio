<dialog id="source-dialog" aria-labelledby="source-title">
  <header class="editor-head">
    <div>
      <p class="editor-eyebrow">SOURCE REVIEW</p>
      <h2 id="source-title">來源與待確認</h2>
    </div>
    <button type="button" id="source-close" aria-label="關閉來源與待確認">✕</button>
  </header>
  <div class="source-tabs">
    <button type="button" id="source-connections" aria-pressed="true">連線確認</button>
    <button type="button" id="source-notes" aria-pressed="false">原圖註記</button>
    <button type="button" id="source-info" aria-pressed="false">來源資料</button>
  </div>
  <div class="source-scroll" id="source-body"></div>
</dialog>
